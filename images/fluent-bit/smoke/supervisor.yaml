# Rendered by smoke/smoke_test.go; {{.Endpoint}} is its OpAMP server.
# The agent block is the one the supervisor's README gives for Fluent
# Bit, so the smoke test also proves that snippet runs against this
# image.
version: 1
server:
  endpoint: {{.Endpoint}}
  api_key: agent_smoke_test
  transport: http
  poll_interval_seconds: 1
agent:
  type: fluent-bit
  binary_path: /usr/local/bin/fluent-bit
  config_path: /etc/fluent-bit/fluent-bit.yaml
  health_check_url: http://localhost:2020/api/v1/health
