# Rendered by smoke/smoke_test.go; {{.Endpoint}} is its OpAMP server.
# The agent block is the one the supervisor's README gives for Vector,
# so the smoke test also proves that snippet runs against this image.
# There is no health_check_url: the adapter takes Vector's from api.address
# in the delivered config.
version: 1
server:
  endpoint: {{.Endpoint}}
  api_key: agent_smoke_test
  transport: http
  poll_interval_seconds: 1
agent:
  type: vector
  binary_path: /usr/local/bin/vector
  config_path: /etc/vector/vector.yaml
